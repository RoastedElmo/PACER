<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Interval Pacer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pacer">
<link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Clock_icon.svg/512px-Clock_icon.svg.png">
<style>
    :root {
        --bg: #121212; --card: #1e1e1e; --text: #ffffff;
        --accent: #007bff; --success: #28a745; --danger: #dc3545;
        --active: #ffc107;
    }
    body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: var(--bg); color: var(--text);
        margin: 0; padding: 20px;
        display: flex; flex-direction: column; align-items: center;
    }
    .container { width: 100%; max-width: 400px; }
    h2 { text-align: center; margin-bottom: 20px; }
    .interval-row {
        background: var(--card); border-radius: 12px;
        padding: 15px; margin-bottom: 12px;
        display: flex; gap: 8px; align-items: center;
        border: 2px solid transparent; transition: border 0.2s;
    }
    .interval-row.active { border: 2px solid var(--active); }
    .input-group { display: flex; flex-direction: column; flex: 1; }
    label { font-size: 11px; color: #aaa; margin-bottom: 4px; text-transform: uppercase; }
    input {
        background: #2a2a2a; color: #fff; border: 1px solid #444;
        border-radius: 6px; padding: 10px; font-size: 16px;
        width: 100%; box-sizing: border-box; text-align: center;
    }
    button {
        border: none; border-radius: 8px; padding: 15px;
        font-size: 16px; font-weight: bold; cursor: pointer; color: white;
    }
    .btn-remove { background: var(--danger); padding: 10px; flex: 0 0 40px; margin-top: 15px; }
    .btn-add { background: var(--card); width: 100%; margin-bottom: 20px; border: 1px dashed #555; }
    .btn-action { width: 100%; font-size: 20px; padding: 20px; text-transform: uppercase; }
    .btn-start { background: var(--success); }
    .btn-stop { background: var(--danger); display: none; }
    
    /* Hide number arrows */
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
</style>
</head>
<body>

<div class="container">
    <h2>Interval Pacer</h2>
    <div id="intervals-container"></div>
    <button class="btn-add" onclick="addInterval(0, 0, 120)">+ Add Interval</button>
    <button id="start-btn" class="btn-action btn-start" onclick="startPacer()">START</button>
    <button id="stop-btn" class="btn-action btn-stop" onclick="stopPacer()">STOP</button>
</div>

<!-- Silent audio loop to force iOS Safari to keep JS running when screen is off -->
<audio id="keep-awake" loop playsinline src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>

<script>
    let intervals = [
        { min: 2, sec: 0, bpm: 120 },
        { min: 0, sec: 25, bpm: 190 },
        { min: 0, sec: 10, bpm: 250 },
        { min: 0, sec: 25, bpm: 190 }
    ];

    const container = document.getElementById('intervals-container');
    let isRunning = false;
    let audioCtx;
    let worker;
    let currentIntervalIndex = 0;
    let nextNoteTime = 0.0;
    let intervalEndTime = 0.0;

    // Initialize UI
    function renderIntervals() {
        container.innerHTML = '';
        intervals.forEach((inv, index) => {
            const row = document.createElement('div');
            row.className = 'interval-row';
            row.id = `row-${index}`;
            row.innerHTML = `
                <div class="input-group">
                    <label>Min</label>
                    <input type="number" inputmode="numeric" min="0" value="${inv.min}" onchange="updateInterval(${index}, 'min', this.value)">
                </div>
                <div class="input-group">
                    <label>Sec</label>
                    <input type="number" inputmode="numeric" min="0" value="${inv.sec}" onchange="updateInterval(${index}, 'sec', this.value)">
                </div>
                <div class="input-group">
                    <label>BPM</label>
                    <input type="number" inputmode="numeric" min="30" value="${inv.bpm}" onchange="updateInterval(${index}, 'bpm', this.value)">
                </div>
                <button class="btn-remove" onclick="removeInterval(${index})">X</button>
            `;
            container.appendChild(row);
        });
    }

    function addInterval(min, sec, bpm) {
        intervals.push({ min, sec, bpm });
        renderIntervals();
    }

    function removeInterval(index) {
        if (intervals.length > 1) {
            intervals.splice(index, 1);
            renderIntervals();
        }
    }

    function updateInterval(index, field, value) {
        intervals[index][field] = parseInt(value) || 0;
    }

    function highlightRow(index) {
        document.querySelectorAll('.interval-row').forEach(row => row.classList.remove('active'));
        const activeRow = document.getElementById(`row-${index}`);
        if (activeRow) activeRow.classList.add('active');
    }

    // Audio and Scheduling Engine
    function scheduleNote(time) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.frequency.value = 880; // High pitch beep
        gain.gain.setValueAtTime(1, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
        
        osc.start(time);
        osc.stop(time + 0.1);
    }

    function scheduler() {
        while (nextNoteTime < audioCtx.currentTime + 0.1) {
            // Check if current interval time has elapsed
            if (nextNoteTime >= intervalEndTime) {
                currentIntervalIndex = (currentIntervalIndex + 1) % intervals.length; // Loop back
                highlightRow(currentIntervalIndex);
                
                const cur = intervals[currentIntervalIndex];
                const durationSeconds = (cur.min * 60) + cur.sec;
                intervalEndTime = nextNoteTime + durationSeconds;
            }

            // Schedule the beep
            scheduleNote(nextNoteTime);

            // Advance time to next beat
            const curBPM = intervals[currentIntervalIndex].bpm;
            const secondsPerBeat = 60.0 / (curBPM || 120);
            nextNoteTime += secondsPerBeat;
        }
    }

    function initWorker() {
        // Inline Web Worker to bypass standard setInterval throttling on mobile
        const workerCode = `
            let timerID = null;
            self.onmessage = function(e) {
                if (e.data === "start") {
                    timerID = setInterval(() => postMessage("tick"), 25);
                } else if (e.data === "stop") {
                    clearInterval(timerID);
                    timerID = null;
                }
            };
        `;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        worker = new Worker(URL.createObjectURL(blob));
        worker.onmessage = function(e) {
            if (e.data === "tick" && isRunning) scheduler();
        };
    }

    function startPacer() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            initWorker();
        }
        
        // Force iOS to allow audio by user gesture
        audioCtx.resume();
        document.getElementById('keep-awake').play().catch(e => console.log("Awake audio blocked:", e));

        isRunning = true;
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('stop-btn').style.display = 'block';

        // Set initial timing
        currentIntervalIndex = 0;
        const cur = intervals[currentIntervalIndex];
        const durationSeconds = (cur.min * 60) + cur.sec;
        
        nextNoteTime = audioCtx.currentTime + 0.05;
        intervalEndTime = nextNoteTime + durationSeconds;
        
        highlightRow(currentIntervalIndex);
        worker.postMessage("start");
    }

    function stopPacer() {
        isRunning = false;
        worker.postMessage("stop");
        document.getElementById('keep-awake').pause();
        
        document.getElementById('start-btn').style.display = 'block';
        document.getElementById('stop-btn').style.display = 'none';
        document.querySelectorAll('.interval-row').forEach(row => row.classList.remove('active'));
    }

    // Initial render
    renderIntervals();
</script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/PACER/sw.js');
        });
    }
</script>
</body>
</html>
